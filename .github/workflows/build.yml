name: Build - .NET Framework

on:
  push:
    branches:
      - appsec-demo
    paths-ignore:
      - "appsec/**"
      - ".github/README.md"
  pull_request:
    branches: [appsec-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect environment
        run: |
          # In GitHub-hosted Windows runners, the default shell is PowerShell Core (pwsh), so it should return `Core`.
          # Can be use to inspect the runner environment if we switch to `self-hosted`.
          # 
          # Returns one of: CMD, Core, Desktop
          (dir 2>&1 *`|echo CMD);&<# rem #>echo ($PSVersionTable).PSEdition

      - name: Verify .NET Framework 3.5
        shell: pwsh
        run: |
          $referencePath = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\v3.5"
          $frameworkList = Join-Path $referencePath "RedistList\FrameworkList.xml"

          Write-Host "Checking .NET Framework 3.5 reference assemblies..."
          Write-Host "Path: $referencePath"

          if (-not (Test-Path $frameworkList -PathType Leaf)) { 
            throw ".NET Framework 3.5 reference assembly manifest not found."
          }
            
          Write-Host ".NET Framework 3.5 reference assembly manifest found."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Show MSBuild version
        shell: pwsh
        run: msbuild -version

      - name: Build
        shell: pwsh
        run: |
          msbuild WebGoat.NET.sln `
            /t:Rebuild `
            /p:Configuration=Debug `
            /p:Platform="Any CPU" 

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }